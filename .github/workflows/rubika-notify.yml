name: Rubika Result Notifier

on:
  workflow_run:
    workflows: ["Rubika Python Worker"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted notifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notifier dependency
        run: python -m pip install --disable-pip-version-check -r rubika_python_cloud/requirements.txt
      - name: Download worker result artifact
        uses: actions/download-artifact@v4
        with:
          name: result
          path: result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Send result to Rubika
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: python rubika_python_cloud/notify.py
