[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "as-terminal"
version = "1.2.1"
description = "A lightweight terminal-like Python environment for Termux and Android"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Sajad"}]
keywords = ["termux", "terminal", "python", "android"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Operating System :: Android",
  "Environment :: Console",
]

[project.scripts]
as-terminal = "as_terminal.core:main"

[tool.setuptools]
packages = ["as_terminal"]
